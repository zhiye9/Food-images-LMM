items_with_true_weights:
  direct_estimation:
    template: |
      You are a professional nutritionist with expertise in food portion estimation and nutritional analysis.

      Task: Given the food image and the list of food items with their measured weights, estimate the total nutritional content of the entire plate.

      FOOD ITEMS AND WEIGHTS:
      {item_list_with_weights}

      STEP 1 - Cooking Method Identification
      For each food item listed above, identify its most likely cooking method from the following options: raw, boiled, steamed, stir-fried, deep-fried, baked/roasted, grilled, other.
      Format:
      - <item_name>: <cooking_method>

      STEP 2 - Total Nutrition Estimation
      Based on the identified items, their weights, and cooking methods, estimate the total nutritional content:
      - Total mass: <number> g
      - Total calories: <number> kcal
      - Fat: <number> g
      - Carbohydrates: <number> g
      - Protein: <number> g

      Important:
      - Provide SINGLE numeric values (no ranges)
      - Consider how the cooking method affects nutrient density
      - Base your estimates on the given weights
      - Do NOT add, infer, or assume any food items beyond those listed above
      - ONLY use the exact items provided in FOOD ITEMS AND WEIGHTS
    generation_config:
      max_new_tokens: 500

  itemized_analysis:
    template: |
      You are a professional nutritionist with expertise in food portion estimation and nutritional analysis.

      Task: Given the food image and the list of food items with their measured weights, estimate the per-item and total nutritional content.

      FOOD ITEMS AND WEIGHTS:
      {item_list_with_weights}

      STAGE 1 - Cooking Method Identification
      For each food item listed above, identify its most likely cooking method from: raw, boiled, steamed, stir-fried, deep-fried, baked/roasted, grilled, other.
      Format:
      - <item_name>: <cooking_method>

      STAGE 2 - Per-Item Nutrition Estimation
      For each item, given its weight and cooking method, estimate nutrition:
      - <item_name> (<weight> g, <cooking_method>):
        - Calories: <number> kcal
        - Fat: <number> g
        - Carbohydrates: <number> g
        - Protein: <number> g

      STAGE 3 - Total Nutrition Summary
      Sum all items:
      - Total mass: <number> g
      - Total calories: <number> kcal
      - Fat: <number> g
      - Carbohydrates: <number> g
      - Protein: <number> g

      Important:
      - Provide SINGLE numeric values (no ranges)
      - Consider how the cooking method affects nutrient density
      - Do NOT add, infer, or assume any food items beyond those listed above
      - ONLY estimate nutrition for the exact items provided in FOOD ITEMS AND WEIGHTS
    generation_config:
      max_new_tokens: 1200

