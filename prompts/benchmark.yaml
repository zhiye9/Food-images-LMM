total_mass_only:
  direct_estimation:
    template: |
      You are a professional nutritionist with expertise in food portion estimation and nutritional analysis.

      Task: Given the food image and the total mass of all food on the plate, identify the food items and estimate total nutrition.

      TOTAL MASS OF ALL FOOD: {total_mass_g} g

      STEP 1 - Food Item Identification
      List all visible food items/components in the image:
      - Item 1: <name>
      - Item 2: <name>
      ...

      STEP 2 - Cooking Method Identification
      For each identified food item, determine the cooking method from: raw, boiled, steamed, stir-fried, deep-fried, baked/roasted, grilled, other.
      Format:
      - <item_name>: <cooking_method>

      STEP 3 - Total Nutrition Estimation
      Based on the identified items, total mass ({total_mass_g} g), and cooking methods, estimate:
      - Total mass: {total_mass_g} g
      - Total calories: <number> kcal
      - Fat: <number> g
      - Carbohydrates: <number> g
      - Protein: <number> g

      Important:
      - Provide SINGLE numeric values (no ranges)
      - The total mass is given as {total_mass_g} g
      - Consider how the cooking method affects nutrient density
    generation_config:
      max_new_tokens: 500

  itemized_analysis:
    template: |
      You are a professional nutritionist with expertise in food portion estimation and nutritional analysis.

      Task: Given the food image and the total mass of all food, identify items, allocate the mass across items, and estimate per-item nutrition.

      TOTAL MASS OF ALL FOOD: {total_mass_g} g

      STAGE 1 - Food Item Identification and Cooking Method
      List all visible food items and their cooking method from: raw, boiled, steamed, stir-fried, deep-fried, baked/roasted, grilled, other.
      Format:
      - <item_name>: <cooking_method>

      STAGE 2 - Mass Allocation
      Distribute the total mass ({total_mass_g} g) across the identified items. The sum of all item masses should approximately equal {total_mass_g} g.
      Format:
      - <item_name>: <number> g

      STAGE 3 - Per-Item Nutrition Estimation
      For each item, based on its allocated mass and cooking method, estimate nutrition:
      - <item_name> (<mass> g, <cooking_method>):
        - Calories: <number> kcal
        - Fat: <number> g
        - Carbohydrates: <number> g
        - Protein: <number> g

      STAGE 4 - Total Nutrition Summary
      Sum all items:
      - Total mass: <number> g
      - Total calories: <number> kcal
      - Fat: <number> g
      - Carbohydrates: <number> g
      - Protein: <number> g

      Important:
      - Provide SINGLE numeric values (no ranges)
      - The total mass across all items should sum to approximately {total_mass_g} g
    generation_config:
      max_new_tokens: 1200

